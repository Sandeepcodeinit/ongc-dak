<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>India Map</title>
    <!-- Include amCharts library -->
    <script src="index.js"></script>
    <script src="map.js"></script>
    <script src="indiaLow.js"></script>
    <script src="Animated.js"></script>
    <style>
        /* Add your custom CSS styles here if needed */
        #chartdiv {
            width: 100%;
            height: 500px;
        }
    </style>
</head>
<body>
    <!-- Div to hold the map -->
    <div id="chartdiv"></div>

    <!-- JavaScript code to initialize and customize the map -->
    <script>
        // Create a new am5 Root
        var root = am5.Root.new("chartdiv");

        // Set themes
        root.setThemes([
            am5themes_Animated.new(root)
        ]);

        // Create the map chart
        var chart = root.container.children.push(am5map.MapChart.new(root, {
            panX: "translateX",
            panY: "translateY",
            projection: am5map.geoMercator(),
			layout: root.horizontalLayout
        }));

        // Create main polygon series for India
        var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
            geoJSON: am5geodata_indiaLow,
			  calculateAggregates: true,
			  valueField: "value"
        }));

        // Add tooltips to state polygons
        polygonSeries.mapPolygons.template.setAll({
            tooltipHTML: "<b>{name}</b><br>Population: {population}<br>Area: {area}",
			interactive: true,
			toggleKey: "active",
        });
		
		polygonSeries.mapPolygons.template.states.create("hover", {
		  fill: root.interfaceColors.get("primaryButtonHover")
		});

		polygonSeries.mapPolygons.template.states.create("active", {
		  fill: root.interfaceColors.get("primaryButtonHover")
		});
		polygonSeries.set("heatRules", [{
		  target: polygonSeries.mapPolygons.template,
		  dataField: "value",
		  min: am5.color(0x8ab7ff),
		  max: am5.color(0x25529a),
		  key: "fill"
		}]);
		
		

        // Add states data with population and area
        var states = [

		var previousPolygon;

		polygonSeries.mapPolygons.template.on("active", function (active, target) {
		  if (previousPolygon && previousPolygon != target) {
			previousPolygon.set("active", false);
		  }
		  previousPolygon = target;
		  
		  if (target.get("active")) {
			console.log(target.dataItem.dataContext.value);
			console.log(target.dataItem.dataContext.id);
			console.log(target.dataItem.dataContext.name); /// any action
		  }
		});
		
        // Set states data
        polygonSeries.data.setAll(states);

        chart.appear(1000, 100);

    </script>
